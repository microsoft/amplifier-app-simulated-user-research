[project]
name = "amplifier-module-tool-simulated-user-research"
version = "0.1.0"
description = "Agent-callable tools for running simulated-user-research audit rounds (thin wrapper over the amplifier-app-simulated-user-research lib)"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "Microsoft MADE:Explorations Team" },
]
dependencies = [
    # The lib this module wraps, from the PUBLISHED repo -- not a path/editable
    # install of the checkout that happens to contain this module. Being
    # self-sufficient matters: this module is consumable on its own (someone
    # can reference it by git URL from their own bundle), and it must not
    # depend on the Amplifier bundle activator having editable-installed the
    # repo root first. When the L3 bundle IS used, the activator installs the
    # local checkout before this module and that install satisfies this
    # requirement, so local development still exercises the working tree.
    "amplifier-app-simulated-user-research @ git+https://github.com/microsoft/amplifier-app-simulated-user-research@main",
    # Direct git references for the FULL transitive git/URL-dependency
    # closure of amplifier-app-simulated-user-research (-> amplifier-module-
    # pipeline-runner -> {amplifier-foundation, amplifier-module-loop-
    # pipeline} -> amplifier-unified-llm-client). Required because the
    # amplifier module activator installs each module via
    # `uv pip install -e . --no-sources` (uv's *pip-compatible* interface) --
    # which rejects any URL/git dependency that appears only transitively
    # unless it is ALSO a direct requirement of the package being installed,
    # and which does NOT honor [tool.uv] constraint-dependencies /
    # override-dependencies (those only apply to uv's *project* interface:
    # `uv lock`/`uv sync` -- confirmed by testing both). Verified live, one
    # hop at a time: omitting any line here reproduces "Package `X` was
    # included as a URL dependency. URL dependencies must be expressed as
    # direct requirements or constraints." for that exact package. If
    # activation ever fails again with the same error for a NEW package,
    # add that package's exact dependency string here too.
    "amplifier-module-pipeline-runner @ git+https://github.com/microsoft/amplifier-bundle-attractor@main#subdirectory=modules/pipeline-runner",
    "amplifier-foundation @ git+https://github.com/microsoft/amplifier-foundation@main",
    "amplifier-module-loop-pipeline @ git+https://github.com/microsoft/amplifier-bundle-attractor@main#subdirectory=modules/loop-pipeline",
    "amplifier-unified-llm-client @ git+https://github.com/microsoft/amplifier-bundle-attractor@main#subdirectory=modules/unified-llm-client",
]

[project.entry-points."amplifier.modules"]
tool-simulated-user-research = "amplifier_module_tool_simulated_user_research:mount"

[build-system]
requires = [
    "hatchling",
]
build-backend = "hatchling.build"

[tool.uv]
package = true
# Constraint-only pins (NOT direct dependencies) for the transitive git/URL
# deps that amplifier-app-simulated-user-research -> amplifier-module-pipeline-runner
# pulls in. Required because the amplifier module activator installs each
# module via `uv pip install -e . --no-sources` (uv's legacy pip resolver),
# which rejects any URL/git dependency that appears only transitively unless
# it is ALSO present as a direct requirement or a constraint of the package
# being installed. Verified live by installing incrementally: adding these
# as [project.dependencies] would be semantically wrong (this module doesn't
# use amplifier-foundation directly) and duplicating docs already say
# "expressed as direct requirements OR CONSTRAINTS file" -- constraints are
# the correct mechanism. If activation ever fails again with the same
# "Package `X` was included as a URL dependency" error for a NEW package,
# add that package's exact dependency string here too.
constraint-dependencies = [
    "amplifier-module-pipeline-runner @ git+https://github.com/microsoft/amplifier-bundle-attractor@main#subdirectory=modules/pipeline-runner",
    "amplifier-foundation @ git+https://github.com/microsoft/amplifier-foundation@main",
]

[tool.uv.sources]
# LOCAL path source for in-repo development (`uv sync` inside this module).
# The amplifier module activator installs with `--no-sources`, which strips
# this override -- at that point the bare name above must resolve. Once the
# repo is public, downstream consumers referencing this module by git URL
# should add:
#   amplifier-app-simulated-user-research = { git = "https://github.com/microsoft/amplifier-app-simulated-user-research", rev = "main" }
amplifier-app-simulated-user-research = { path = "../..", editable = true }

[tool.hatch.build.targets.wheel]
packages = [
    "amplifier_module_tool_simulated_user_research",
]

[tool.hatch.metadata]
allow-direct-references = true

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=1.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
